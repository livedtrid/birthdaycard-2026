<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Convite Aniversário</title>
    <meta name="description" content="Convite aniversário 2026"/>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="./js/info-message.js" type="module"></script>
    <script src="./js/play-on-click.js"></script>
    <script src="./js/hide-on-play.js"></script>

    <meta property="og:title" content="Convite Jurássico 🦖🎂">
    <meta property="og:description"
          content="Vem comer uns bolo no dia 01/02/2026 para comemorar os meus 43 ano. Já to virando um dinossauro.">
    <meta property="og:image" content="https://livedtrid.github.io/birthdaycard-2026/convite.png">
    <meta property="og:url" content="https://livedtrid.github.io/birthdaycard-2026/">
    <meta property="og:type" content="website">

    <script>
        AFRAME.registerComponent('base', {
            init: function () {
                const el = this.el;

                // Só começamos depois do entity estar totalmente carregado
                el.addEventListener('loaded', () => {
                    el.emit('goRight');
                });

                el.addEventListener('animationcomplete__right', () => {
                    el.emit('goLeft');
                });

                el.addEventListener('animationcomplete__left', () => {
                    el.emit('goRight');
                });
            }
        });
    </script>


</head>

<body>
<a-scene
        background="color: #000000"
        renderer="toneMapping: ACESFilmic;"
        info-message="htmlSrc: #messageText"
>
    <a-assets>
        <a-asset-item id="testbed" src="retro_8-bit_console_and_tv.glb"></a-asset-item>
        <a-asset-item id="messageText" src="message.html"></a-asset-item>

        <a-asset-item id="screen" src="screen.glb"></a-asset-item>

        <video id="videoTex"
               src="video.mp4"
               autoplay loop muted playsinline
               crossorigin="anonymous"
        ></video>

        <img id="convite" src="convite.png" crossorigin="anonymous"/>

    </a-assets>

    <a-entity id="rig" position="0 0 2">
        <a-entity id="camera" position="0 1.6 0" camera>

            <!-- sombra / outline -->
            <a-entity
                    position="0 0.3 -1.51"
                    text="align: center;
        width: 6.1;
        wrapCount: 100;
        color: black;
        value: Toca no meu nariz"
                    hide-on-play="#videoTex">

            </a-entity>

            <!-- texto principal -->
            <a-entity
                    position="0 0.3 -1.5"
                    text="align: center;
        width: 6;
        wrapCount: 100;
        color: white;
        value: Toca no meu nariz"
                    hide-on-play="#videoTex">
            </a-entity>
        </a-entity>

        <a-entity id="lhand" effect-controls="hand: left;"></a-entity>

        <a-entity id="rhand" effect-controls="hand: right;"></a-entity>
    </a-entity>
    <a-entity
            id="base"
            base
            geometry="primitive: cylinder; height: 0.1; radius: 1.93"
            position="0 0 -2"
            material="color: #201d1d"
            shadow
            animation__right="property: rotation;
                      to: 0 20 0;
                      dur: 6200;
                      easing: easeInOutSine;
                      startEvents: goRight"

            animation__left="property: rotation;
                     to: 0 -45 0;
                     dur: 6200;
                     easing: easeInOutSine;
                     startEvents: goLeft"
    >
        <a-entity id="tooncar" gltf-model="#testbed" position="-1.5 0 0" rotation="0 270 0" scale="0.5 0.5 0.5"
                  shadow>


            <a-entity geometry="primitive: plane; width: 2" position="0.70124 1.28 -3.11021"
                      material="shader: flat; src: #videoTex" rotation="0 109.25568 0" scale="1.12 1.754 1"
                      play-on-click="">

            </a-entity>

            <a-plane geometry="height: 0.675; width: 1.2" position="1.46381 2.28871 -0.57183"
                     material="shader: flat; src: #convite" rotation="0 136.88591979250012 0"
                     scale="2.4442 5.43297 1.26642">

            </a-plane>

        </a-entity>

        <a-entity
                id="neon01"
                geometry="primitive: torus; radius: 1.92; radiusTubular: 0.02; segmentsRadial: 50; segmentsTubular: 40"
                material="color: #d100e0; emissive: #b300a4; emissiveIntensity: 9.34"
                rotation="90 0 0"
        >
        </a-entity>
    </a-entity>


    <a-entity id="ambient" light="type: ambient; intensity: 0.48; color: #ffffff"></a-entity>
    <a-entity id="point01" light="color: #7cd2fe; intensity: 5; type: point;" position="0 3.51 -1"></a-entity>
</a-scene>

</body>
</html>
